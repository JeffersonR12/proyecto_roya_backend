server {
    listen 10000 default_server;
    server_name _;
    root /var/www/html/public;
    index index.php;

    # Las fotos llegan en base64 dentro del lote de sincronizacion (hasta 5 MB cada una).
    client_max_body_size 20M;

    access_log /dev/stdout;
    error_log /dev/stderr warn;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), geolocation=(self), microphone=()" always;

    gzip on;
    gzip_vary on;
    gzip_types application/javascript text/javascript text/css application/json application/manifest+json application/wasm image/svg+xml;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_read_timeout 60s;
    }

    # El service worker siempre se revalida: es lo que detecta las versiones nuevas.
    location = /sw.js {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Archivos de Vite con hash en el nombre: cache de un ano.
    location /build/assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        types { application/manifest+json webmanifest; }
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location = /build/version.json {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # Modelo y binarios ORT: el service worker los versiona; aqui basta una semana.
    location ~ ^/(onnx|models)/ {
        types {
            application/wasm wasm;
            text/javascript mjs;
            application/json json;
            application/octet-stream onnx;
        }
        add_header Cache-Control "public, max-age=604800" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
