# Blueprint de Render: crea el servicio web de Roya desde el Dockerfile.
# Los valores con "sync: false" se piden en el panel al crear el Blueprint: nunca van en el repo.
# Guia paso a paso: deploy/README-render.md
services:
  - type: web
    name: roya-app
    runtime: docker
    plan: free
    region: oregon
    branch: main
    dockerfilePath: ./Dockerfile
    healthCheckPath: /up
    autoDeploy: true
    envVars:
      # --- App ---
      - key: APP_NAME
        value: Roya
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        sync: false # php artisan key:generate --show
      - key: APP_URL
        sync: false # https://roya-app.onrender.com
      - key: TRUSTED_PROXIES
        value: "*" # el proxy de Render termina el HTTPS y cambia de IP
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: warning

      # --- Base de datos (TiDB Cloud Serverless, compatible con MySQL) ---
      - key: DB_CONNECTION
        value: mysql
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "4000"
      - key: DB_DATABASE
        value: roya
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: MYSQL_ATTR_SSL_CA
        value: /etc/ssl/certs/ca-certificates.crt
      - key: DB_INIT_COMMAND
        value: SET SESSION innodb_lock_wait_timeout=5

      # --- Sesion, cache y cola (en la base de datos) ---
      - key: SESSION_DRIVER
        value: database
      - key: SESSION_SECURE_COOKIE
        value: "true"
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database

      # --- Fotos de diagnostico (Supabase Storage, compatible con S3) ---
      - key: DIAGNOSTICOS_DISK
        value: s3
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_DEFAULT_REGION
        sync: false
      - key: AWS_BUCKET
        value: diagnosticos
      - key: AWS_ENDPOINT
        sync: false # https://<ref>.supabase.co/storage/v1/s3
      - key: AWS_USE_PATH_STYLE_ENDPOINT
        value: "true"

      # --- Correo (recuperacion de contrasena) ---
      - key: MAIL_MAILER
        value: smtp
      - key: MAIL_SCHEME
        value: smtp
      - key: MAIL_HOST
        value: smtp.gmail.com
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_FROM_ADDRESS
        sync: false
      - key: MAIL_FROM_NAME
        value: RiwiScan
