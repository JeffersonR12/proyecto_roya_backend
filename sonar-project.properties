sonar.projectKey=proyecto_roya_backend
sonar.projectName=Proyecto Roya Backend
sonar.projectVersion=2.0
sonar.sourceEncoding=UTF-8

sonar.sources=app,routes,config,database,resources,scripts
sonar.tests=tests,resources/js
sonar.test.inclusions=tests/**/*.php,resources/js/**/*.test.js
sonar.exclusions=vendor/**,node_modules/**,storage/**,public/build/**,public/onnx/**,public/models/**,bootstrap/cache/**,**/*.test.js

sonar.python.version=3.10

# Fuera de la cobertura: entrenamiento/tooling offline, migraciones, seeders y configuración.
sonar.coverage.exclusions=scripts/**,database/**,config/**,resources/views/**

# Generar antes de analizar:
#   PHP: phpunit con PCOV -> coverage/clover.xml y coverage/junit.xml
#   JS:  npm run test:js:coverage -> coverage/js/lcov.info
sonar.php.coverage.reportPaths=coverage/clover.xml
sonar.php.tests.reportPath=coverage/junit.xml
sonar.javascript.lcov.reportPaths=coverage/js/lcov.info
